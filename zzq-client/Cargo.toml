[package]
name = "zzq-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "MQTT 3.1.1 and 5.0 client on zzq IO lanes."
keywords = ["mqtt", "client", "iot", "tokio"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[features]
default = ["tls", "quic"]
tls = ["zzq-tokio/tls"]
quic = ["tls", "zzq-tokio/quic"]

[dependencies]
zzq-proto = { workspace = true, features = ["std"] }
zzq-tokio = { workspace = true, default-features = false }
bytes = { workspace = true, features = ["std"] }
bytestring.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
# Path only, so publishing drops it: zzq-broker dev-depends on zzq-client.
zzq-broker = { path = "../zzq-broker" }
zzq-proto = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
