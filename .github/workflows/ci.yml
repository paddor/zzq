name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  ruby:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/ruby
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: bindings/ruby
      - name: cargo fmt
        run: cargo fmt --manifest-path bindings/ruby/Cargo.toml --all --check
      - name: cargo clippy
        run: cargo clippy --manifest-path bindings/ruby/Cargo.toml --all-targets -- -D warnings
      - name: ruby syntax
        working-directory: bindings/ruby
        run: |
          find lib test -name '*.rb' -print0 | xargs -0 -n1 ruby -cw
          ruby -cw Rakefile
          ruby -cw zzq.gemspec
      - name: rake
        working-directory: bindings/ruby
        run: bundle exec rake
