name: release ruby gem

# The filename stays release.yml: RubyGems trusts this workflow to publish
# the zzq gem.
on:
  push:
    tags: ['ruby-v*']

permissions:
  contents: read

jobs:
  publish:
    name: publish to RubyGems
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: bindings/ruby
      - name: check the tag
        working-directory: bindings/ruby
        run: |
          version="$(ruby -Ilib -rzzq/version -e 'print ZZQ::VERSION')"
          test "$GITHUB_REF_NAME" = "ruby-v$version"
      - uses: rubygems/release-gem@v1
        with:
          working-directory: bindings/ruby
      - name: GitHub release
        working-directory: bindings/ruby
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pkg/*.gem --generate-notes
