[package]
name = "zzq-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "ISC OR Apache-2.0"
publish = false
description = "AFL fuzz targets for zzq."

[dependencies]
afl = "0.18"
zzq-proto = { path = "../../zzq-proto" }
zzq-tokio = { path = "../../zzq-tokio", default-features = false, features = ["fuzzing"] }
zzq-broker = { path = "../../zzq-broker", default-features = false, features = ["fuzzing"] }
zzq-disk = { path = "../../zzq-disk", features = ["fuzzing"] }

[lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
