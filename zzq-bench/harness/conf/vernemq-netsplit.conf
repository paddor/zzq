# vernemq-cluster.conf, serving through a netsplit: the nodes left take
# CONNECT, PUBLISH, SUBSCRIBE and UNSUBSCRIBE while one is gone.
allow_anonymous = on
log.console.level = warning
max_inflight_messages = 1000
receive_max_client = 1000
receive_max_broker = 1000
max_online_messages = 100000
max_offline_messages = 100000
listener.max_connections = infinity
erlang.schedulers.total = 1
erlang.schedulers.online = 1
distributed_cookie = zzqfailover
allow_register_during_netsplit = on
allow_publish_during_netsplit = on
allow_subscribe_during_netsplit = on
allow_unsubscribe_during_netsplit = on
