# FlashMQ 1.27.3 as XMQ's tests tune it (tcp_nodelay, warning logs, QoS
# queue caps raised), with threads set to the 4-CPU broker budget.
thread_count 4
log_level warning
allow_anonymous true
max_qos_msg_pending_per_client 65535
max_qos_bytes_pending_per_client 268435456

listen {
  protocol mqtt
  port 1883
  tcp_nodelay true
}
