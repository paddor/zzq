# Appended to the vernemq.conf of a 2.2.1 source build. Windows of 1000 for
# MQTT 3.1.1 and 5, queues of 100000, no connection cap, logs at warning, 4
# schedulers. There are no rate limits to lift.
listener.tcp.default = 0.0.0.0:1883
allow_anonymous = on
log.console.level = warning
max_inflight_messages = 1000
receive_max_client = 1000
receive_max_broker = 1000
max_online_messages = 100000
max_offline_messages = 100000
listener.max_connections = infinity
erlang.schedulers.total = 4
erlang.schedulers.online = 4
