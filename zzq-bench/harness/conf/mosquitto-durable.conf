# mosquitto 2.1 tuned (mosquitto-tuned.conf) with the SQLite plugin: sessions
# with an expiry, their queued messages and retained messages. Commits each
# second (the least it takes), fully synced. The PUBACK does not wait.
# The plugin refuses `persistence true`.
listener 1883
allow_anonymous true
set_tcp_nodelay true
max_inflight_messages 1000
max_queued_messages 100000
persistence_location /mosquitto/data/
plugin /usr/lib/mosquitto_persist_sqlite.so
plugin_opt_sync full
plugin_opt_flush_period 1
