# NATS 2.15 plus what MQTT needs: JetStream, in the store the suite gives
# it (@STORE@), and a server name. Each QoS 1/2 subscription is a JetStream
# consumer on one stream, and 2.15 caps a stream at 1000 consumers, so a
# later QoS 1/2 SUBSCRIBE fails; the cap is off here. The other defaults
# meet the tuned configs: 1024 QoS 1/2 messages in flight per subscription
# (mqtt.max_ack_pending), 64 MiB pending per connection, no rate limits,
# Nagle off.
server_name: zzq
listen: 127.0.0.1:4222
jetstream {
  store_dir: "@STORE@"
  limits {
    default_max_consumers: -1
  }
}
mqtt {
  port: 1883
}
