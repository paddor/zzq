# vernemq-tuned.conf for many connections, with 128 KiB socket buffers. Unset,
# VerneMQ sizes its per-socket Erlang buffer to the larger of the kernel's send
# and receive buffers, and loopback reports a 2.5 MiB send buffer: 16 GB at
# 6000 connections. On a real NIC that rule gives about 128 KiB.
listener.tcp.default = 0.0.0.0:1883
allow_anonymous = on
log.console.level = warning
max_inflight_messages = 1000
receive_max_client = 1000
receive_max_broker = 1000
max_online_messages = 100000
max_offline_messages = 100000
listener.max_connections = infinity
erlang.schedulers.total = 4
erlang.schedulers.online = 4
listener.tcp.buffer_sizes = 131072,131072,131072
