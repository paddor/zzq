# A node of a 3-node NATS 2.15 cluster for the failover suite:
# nats-tuned.conf with routes to the other nodes and the MQTT streams
# replicated to all three. The suite puts the node's number for @I@, its
# store for @STORE@, and its ports for @CLIENT@, @ROUTE@ and @MQTT@.
server_name: n@I@
listen: 127.0.0.1:@CLIENT@
jetstream {
  store_dir: "@STORE@"
  limits {
    default_max_consumers: -1
  }
}
cluster {
  name: zzq
  listen: 127.0.0.1:@ROUTE@
  routes: [
    nats-route://127.0.0.1:6222
    nats-route://127.0.0.1:6223
    nats-route://127.0.0.1:6224
  ]
}
mqtt {
  port: @MQTT@
  stream_replicas: 3
}
