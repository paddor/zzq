[workspace]
members = ["zzq-proto", "zzq-tokio", "zzq-broker", "zzq-client", "zzq-bench"]
default-members = ["zzq-proto", "zzq-tokio", "zzq-broker", "zzq-client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
authors = ["Patrik Wenger <paddor@gmail.com>"]
repository = "https://github.com/paddor/zzq.rs"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
zzq-proto = { path = "zzq-proto", version = "0.1.0", default-features = false }
zzq-tokio = { path = "zzq-tokio", version = "0.1.0", default-features = false }
zzq-broker = { path = "zzq-broker", version = "0.1.0" }
zzq-client = { path = "zzq-client", version = "0.1.0" }
bytes = { version = "1.12", default-features = false }
rustc-hash = "2.1"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = "line-tables-only"
